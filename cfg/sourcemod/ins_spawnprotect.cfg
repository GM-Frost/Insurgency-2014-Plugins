// INS Spawn Protection configuration

// Enable spawn protection
// 0 = Disabled
// 1 = Enabled
sm_ins_spawnprotect_enable "1"

// Maximum spawn protection duration in seconds
sm_ins_spawnprotect_time "15.0"

// Remove protection immediately when player attacks
// 0 = No
// 1 = Yes
sm_ins_spawnprotect_cancel_attack "1"

// Show protection messages to the player
// 0 = No
// 1 = Yes
sm_ins_spawnprotect_announce "1"
