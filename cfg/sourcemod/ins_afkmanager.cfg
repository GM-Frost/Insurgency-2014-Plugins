// ============================================================================
// [INS] AFK Manager
// Configuration
//
// File:
//   cfg/sourcemod/ins_afkmanager.cfg
//
// Default behaviour:
//
// NORMAL PLAYER
//
//   2 minutes AFK while playing
//       -> moved to Spectator
//
//   AFK timer resets
//
//   4 additional minutes AFK in Spectator
//       -> eligible to be kicked if the server is full
//
//   If the server has a free slot
//       -> remains in Spectator and is not kicked
//
//   If multiple AFK spectators are eligible when the server is full
//       -> the longest-AFK non-admin spectator is kicked first (FIFO)
//
//   Minimum inactivity before kick eligibility:
//       approximately 6 minutes total
//
//
// ADMIN
//
//   2 minutes AFK while playing
//       -> moved to Spectator
//
//   Admin remains in Spectator
//       -> never AFK-kicked
//
//
// Dead players waiting for reinforcement:
//       -> AFK timer paused/reset
//
// AFK Manager NEVER bans players.
// ============================================================================


// ============================================================================
// Master Switch
// ============================================================================

// 1 = Enabled
// 0 = Disabled

sm_ins_afk_enabled "1"


// ============================================================================
// Playing Team -> Spectator
// ============================================================================

// Seconds of inactivity before a player on Security or Insurgents
// is moved to Spectator.
//
// 120 seconds = 2 minutes.
//
// Applies to:
//   - normal players
//   - administrators
//
// 0 = Disable automatic move to Spectator.

sm_ins_afk_spec_time "120.0"


// ============================================================================
// Spectator -> Kick
// ============================================================================

// ADDITIONAL seconds of inactivity after entering Spectator
// before a normal player becomes eligible for a capacity kick.
//
// 240 seconds = 4 minutes.
//
// The AFK timer resets when the player is moved to Spectator.
//
// Administrators are NEVER AFK-kicked.
// Normal players are only kicked while every server slot is occupied.
// If several players are eligible, the longest-AFK spectator is first.
//
// 0 = Disable AFK kicking completely.

sm_ins_afk_kick_time "240.0"


// ============================================================================
// First Warning
// ============================================================================

// Show the first AFK warning this many seconds before
// being moved/kicked.
//
// Default:
//
//   60 seconds remaining.
//
// 0 = Disable first warning.

sm_ins_afk_warning_time "60.0"


// ============================================================================
// Final Warning
// ============================================================================

// Show the final AFK warning this many seconds before
// being moved/kicked.
//
// Default:
//
//   15 seconds remaining.
//
// 0 = Disable final warning.

sm_ins_afk_final_warning_time "15.0"


// ============================================================================
// Announcements
// ============================================================================

// Announce automatic AFK moves and kicks to the server.
//
// Examples:
//
//   [AFK] Player was moved to Spectator after 120 seconds of inactivity.
//
//   [AFK] Player was kicked for prolonged inactivity.
//
// 1 = Enabled
// 0 = Disabled

sm_ins_afk_announce "1"


// ============================================================================
// Logs
// ============================================================================

// Number of days AFK logs should be retained.
//
// Logs are stored in:
//
//   addons/sourcemod/logs/ins_afkmanager/
//
// Default:
//   2 days
//
// 0 = Never automatically delete old logs.

sm_ins_afk_log_days "2"
