// ============================================================================
// [INS] LOL Bot Enhancer
// Aggressive native NextBot behaviour for PvP seed matches.
// ============================================================================

// Master switch. Disabling restores the native values captured after configs
// loaded. Re-enable to apply the brutal profile again.
sm_ins_bot_enhancer_enabled "1"

// Recheck native bot settings periodically because game modes and other configs
// can reset them during map or round transitions. Set to 0 to disable checks.
sm_ins_bot_enhancer_enforce_interval "15.0"

// Log each individual native CVAR correction. Leave off for normal operation.
sm_ins_bot_enhancer_verbose "0"

// Admin command:
//   sm_botenhancer_status
// Reports availability and immediately reapplies the profile when enabled.
