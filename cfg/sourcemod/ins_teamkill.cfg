// ============================================================================
// [INS] ReflectTK
// Configuration File
//
// File:
//   cfg/sourcemod/ins_teamkill.cfg
// ============================================================================


// Enable / Disable Plugin
//
// 1 = Enabled
// 0 = Disabled
sm_reflecttk_enabled "1"


// Insurgency Friendly Fire
//
// ReflectTK requires friendly fire to be enabled.
mp_friendlyfire "1"


// Direct friendly fire reflects 50% of its damage.
sm_reflecttk_direct_scale "0.50"


// Grenades, rockets, fire and other blast damage reflect only 20%.
sm_reflecttk_explosive_scale "0.20"


// Damage occurring inside this window is treated as one incident. This keeps
// one grenade hitting several teammates from punishing the thrower repeatedly.
sm_reflecttk_incident_window "1.25"


// Maximum reflected damage from one incident. 0 disables the cap.
sm_reflecttk_incident_cap "35"


// Accidental reflection cannot reduce the attacker below this health.
sm_reflecttk_safety_health "10"


// After accumulating this much calculated reflected damage during one round,
// the attacker is treated as a repeat offender and reflection may become
// lethal. 0 keeps reflection nonlethal permanently.
sm_reflecttk_lethal_threshold "100"
