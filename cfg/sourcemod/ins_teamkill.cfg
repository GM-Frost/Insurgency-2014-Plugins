// ============================================================================
// [INS] ReflectTK
// Configuration File
//
// File:
//   cfg/sourcemod/ins_teamkill.cfg
// ============================================================================


// Enable / Disable Plugin
//
// 1 = Enabled
// 0 = Disabled
sm_reflecttk_enabled "1"


// Insurgency Friendly Fire
//
// ReflectTK requires friendly fire to be enabled.
mp_friendlyfire "1"


// HUD duration in seconds.
sm_reflecttk_hud_duration "1.8"


// HUD horizontal position.
//
// -1.0 = centered
sm_reflecttk_hud_x "-1.0"


// HUD vertical position.
//
// 0.0 = top
// 0.5 = middle
// 1.0 = bottom
sm_reflecttk_hud_y "0.40"
