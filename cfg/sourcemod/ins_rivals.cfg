// ============================================================================
// [INS] LOL Rivals
// Nemesis and revenge configuration
// ============================================================================

// Master switch.
sm_lol_rivals_enabled "1"

// Unanswered kills against the same player required for nemesis status.
sm_lol_rivals_nemesis_kills "3"

// Privately warn both players one kill before nemesis status.
sm_lol_rivals_private_warnings "1"

// Randomized two-line sarcasm callouts at streaks 4, 5, 7, 10, then every
// five kills. Two lines keep long clan tags and UTF-8 names readable.
sm_lol_rivals_fun_callouts "1"

// Personalized colored status for the killer and victim after public
// nemesis, dominance and revenge announcements.
sm_lol_rivals_private_status "1"

// Show an sm_hsay-style center-bottom hint to the dead victim only. Their
// private colored chat status is still shown as well.
sm_lol_rivals_victim_hint "1"

// Brief delay prevents the death transition from overwriting the hint.
sm_lol_rivals_victim_hint_delay "0.40"

// Optional center-screen messages for the involved players.
// Disabled by default to avoid blocking combat visibility.
sm_lol_rivals_center_messages "0"

// Duration of the !rivals / !nemesis information panel.
sm_lol_rivals_panel_time "12"
