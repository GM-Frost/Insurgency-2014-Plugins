// ============================================================================
// [INS] LOL Chat Bot
// Normal-conversation reaction configuration
// ============================================================================

// Master switch. The BOT only listens when this is enabled.
sm_ins_chatbot_enabled "1"

// Per-player cooldown. One players trigger does not silence everyone else.
sm_ins_chatbot_cooldown "8.0"

// Short server-wide guard preventing multiple simultaneous BOT replies.
sm_ins_chatbot_global_cooldown "2.5"

// A players recent human killer may be used for a contextual gay-banter
// response when the player chats within this many seconds after the death.
// Deaths never cause BOT messages by themselves.
sm_ins_chatbot_death_context_window "10.0"

// Save recognized player messages and BOT answers in a separate monthly file:
// addons/sourcemod/logs/ins_chatbot_YYYY-MM.log
// BOT replies remain visible in-game but are not injected into HLstats chat.
sm_ins_chatbot_log_replies "1"

// Behavior:
// - One response maximum per player message.
// - Public chat receives a public response.
// - Team chat receives a response visible only to that same team.
// - Responses are randomly selected and the same line is not repeated twice.
// - Messages without a recognized word are ignored by the BOT.
// - Stretched spellings such as "laaag", "fuckkk" and "gayyyyy" are
//   normalized automatically. Common slang and misspellings are aliases.
// - Cheating slang includes hack/hacker, hax/haxxer and stretched forms.
// - Spawn-killing phrases take priority over spawn callouts and camping.
// - The word "spawn" alone is ignored.
