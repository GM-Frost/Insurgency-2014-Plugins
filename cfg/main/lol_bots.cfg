// ============================================================================
// LOL PvP Bots
// Aggressive / Mobile / Brutal
//
// Goal:
// - Bots fire quickly when a nearby human is exposed
// - Bots actively fight humans
// - Bots engage confidently
// - Bots switch threats quickly
// - Bots use controlled bursts
// - Bots commit to threats instead of constantly changing targets
// - The Bot Enhancer plugin supplies protected movement/pathing controls
// ============================================================================


// ---------------------------------------------------------------------------
// DIFFICULTY
// ---------------------------------------------------------------------------

ins_bot_difficulty "3"
ins_bot_change_difficulty "1"

// A small lethality advantage makes seed bots threatening without turning
// every grazing hit into an artificial one-shot kill.
bot_damage "1.10"


// ---------------------------------------------------------------------------
// REACTION
//
// Difficulty 3 gives bots the strongest native decision making. Keep roughly
// half a second of close-range reaction time and make off-screen surprises
// slower, so strength comes from pressure rather than instant snapshots.
// ---------------------------------------------------------------------------

bot_attackdelay_base "0.50"

bot_attackdelay_frac_hipfirerange "0.30"
bot_attackdelay_frac_desiredrange "0.50"
bot_attackdelay_frac_maxrange "0.75"
bot_attackdelay_frac_outofrange "0.95"

bot_attackdelay_frac_outsidefov "1.05"


// ---------------------------------------------------------------------------
// COMBAT AROUSAL
//
// Bots start alert but human, then react faster after firing, taking fire, or
// staying in combat. This creates strong momentum without permanent auto-aim.
// ---------------------------------------------------------------------------

ins_bot_arousal_combat_max "9"
ins_bot_arousal_firing_max "9"
ins_bot_arousal_suppression_max "7"

ins_bot_arousal_frac_attackdelay_min "0.85"
ins_bot_arousal_frac_attackdelay_med "0.70"
ins_bot_arousal_frac_attackdelay_max "0.55"

ins_bot_arousal_frac_recognizetime_min "0.90"
ins_bot_arousal_frac_recognizetime_med "0.75"
ins_bot_arousal_frac_recognizetime_max "0.60"

ins_bot_arousal_frac_angularvelocity_min "0.90"
ins_bot_arousal_frac_angularvelocity_med "1.05"
ins_bot_arousal_frac_angularvelocity_max "1.20"


// ---------------------------------------------------------------------------
// TARGET SELECTION
//
// Bots reconsider their target frequently instead of tunneling on one player.
// ---------------------------------------------------------------------------

bot_attack_retarget_mintime "0.35"
bot_attack_retarget_maxtime "0.85"


// ---------------------------------------------------------------------------
// FIRING BEHAVIOR
//
// Controlled bursts rather than instant laser fire or endless spraying.
// ---------------------------------------------------------------------------

bot_attack_burst_mintime "0.35"
bot_attack_burst_maxtime "1.20"

// Reload before running completely dry when a short lull is available.
ins_bot_attack_reload_ratio "0.15"

// Make sidearms credible without giving them rifle-like accuracy.
ins_bot_attack_pistol_fire_rate "4.0"


// ---------------------------------------------------------------------------
// WEAPON CONTROL
//
// Better than stock bots, but retain recoil.
// ---------------------------------------------------------------------------

bot_recoil_multiplier "0.48"


// ---------------------------------------------------------------------------
// AIM IMPERFECTION
//
// Bots are dangerous but dont have perfect coordinates on your body.
// ---------------------------------------------------------------------------

bot_targeting_noise_x_base "38"
bot_targeting_noise_y_base "38"
bot_targeting_noise_z_base "48"

bot_targeting_noise_x_frac_hipfirerange "0.80"
bot_targeting_noise_y_frac_hipfirerange "0.80"
bot_targeting_noise_z_frac_hipfirerange "0.80"

bot_targeting_noise_x_frac_desiredrange "1.0"
bot_targeting_noise_y_frac_desiredrange "1.0"
bot_targeting_noise_z_frac_desiredrange "1.0"

bot_targeting_noise_x_frac_maxrange "1.25"
bot_targeting_noise_y_frac_maxrange "1.25"
bot_targeting_noise_z_frac_maxrange "1.25"


// ---------------------------------------------------------------------------
// ENGAGEMENT RANGE
//
// Bots are willing to engage instead of waiting for humans to get close.
// ---------------------------------------------------------------------------

bot_range_frac_hipfirerange "1.00"
bot_range_frac_desiredrange "0.95"
bot_range_frac_maxrange "1.10"


// ---------------------------------------------------------------------------
// GRENADES
//
// This is a real, non-cheat Insurgency bot CVAR.
// ---------------------------------------------------------------------------

ins_bot_max_grenade_range "1100"


// ---------------------------------------------------------------------------
// RPG BEHAVIOR
//
// RPG-7 and AT4 bots may engage a single player, but not at suicide range.
// The grace period prevents immediate rocket spam after a target appears.
// ---------------------------------------------------------------------------

ins_bot_rpg_grace_time "8"
ins_bot_rpg_minimum_firing_distance "512"
ins_bot_rpg_minimum_player_cluster "2"
ins_bot_rpg_player_cluster_radius "460"
