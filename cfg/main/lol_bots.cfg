// ============================================================================
// LOL PvP Bots
// Tactical / Human-like / Brutal
//
// Goal:
// - Bots react quickly
// - Bots actively fight humans
// - Bots engage confidently
// - Bots switch threats quickly
// - Bots use controlled bursts
// - Bots remain imperfect enough to feel human
// ============================================================================


// ---------------------------------------------------------------------------
// DIFFICULTY
// ---------------------------------------------------------------------------

ins_bot_difficulty "3"
ins_bot_change_difficulty "1"

bot_damage "1.0"


// ---------------------------------------------------------------------------
// REACTION
//
// Difficulty 3 already gives bots the strongest built-in AI behavior.
// These settings make combat reactions fast without creating instant
// supernatural 180-degree responses.
// ---------------------------------------------------------------------------

bot_attackdelay_base "0.65"

bot_attackdelay_frac_hipfirerange "0.40"
bot_attackdelay_frac_desiredrange "0.55"
bot_attackdelay_frac_maxrange "0.70"
bot_attackdelay_frac_outofrange "0.85"

bot_attackdelay_frac_outsidefov "1.15"


// ---------------------------------------------------------------------------
// TARGET SELECTION
//
// Bots reconsider their target frequently instead of tunneling on one player.
// ---------------------------------------------------------------------------

bot_attack_retarget_mintime "0.20"
bot_attack_retarget_maxtime "0.60"


// ---------------------------------------------------------------------------
// FIRING BEHAVIOR
//
// Controlled bursts rather than instant laser fire or endless spraying.
// ---------------------------------------------------------------------------

bot_attack_burst_mintime "0.20"
bot_attack_burst_maxtime "0.85"


// ---------------------------------------------------------------------------
// WEAPON CONTROL
//
// Better than stock bots, but retain recoil.
// ---------------------------------------------------------------------------

bot_recoil_multiplier "0.45"


// ---------------------------------------------------------------------------
// AIM IMPERFECTION
//
// Bots are dangerous but dont have perfect coordinates on your body.
// ---------------------------------------------------------------------------

bot_targeting_noise_x_base "55"
bot_targeting_noise_y_base "55"
bot_targeting_noise_z_base "70"

bot_targeting_noise_x_frac_hipfirerange "1.0"
bot_targeting_noise_y_frac_hipfirerange "1.0"
bot_targeting_noise_z_frac_hipfirerange "1.0"

bot_targeting_noise_x_frac_desiredrange "1.0"
bot_targeting_noise_y_frac_desiredrange "1.0"
bot_targeting_noise_z_frac_desiredrange "1.0"

bot_targeting_noise_x_frac_maxrange "1.6"
bot_targeting_noise_y_frac_maxrange "1.6"
bot_targeting_noise_z_frac_maxrange "1.6"


// ---------------------------------------------------------------------------
// ENGAGEMENT RANGE
//
// Bots are willing to engage instead of waiting for humans to get close.
// ---------------------------------------------------------------------------

bot_range_frac_hipfirerange "1.0"
bot_range_frac_desiredrange "1.15"
bot_range_frac_maxrange "1.15"


// ---------------------------------------------------------------------------
// GRENADES
//
// This is a real, non-cheat Insurgency bot CVAR.
// ---------------------------------------------------------------------------

ins_bot_max_grenade_range "1100"


// ---------------------------------------------------------------------------
// RPG BEHAVIOR
//
// Dont let RPG bots shoot someone point-blank.
// Allow RPG use against groups of players.
// ---------------------------------------------------------------------------

ins_bot_rpg_minimum_firing_distance "512"
ins_bot_rpg_minimum_player_cluster "2"
ins_bot_rpg_player_cluster_radius "460"
